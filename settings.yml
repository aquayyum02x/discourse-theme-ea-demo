show_breadcrumbs:
  type: bool
  default: true
  refresh: true

side_nav_enabled:
  type: bool
  default: true
  refresh: true

news_feed_enabled:
  type: bool
  default: true
  refresh: true

news_feed_items:
  type: objects
  default:
    - title: "Apex Legends community update"
      summary: "Read the latest news from the Apex Legends community."
      url: "/c/apex-legends/5"
      date: "September 19, 2026"
  schema:
    name: news_item
    properties:
      title:
        type: string
        required: true
      summary:
        type: string
      url:
        type: string
        required: true
      date:
        type: string

side_nav_icon_rail:
  type: bool
  default: true
  refresh: true

side_nav_hide_default_sections:
  type: bool
  default: true
  refresh: true

side_nav_games:
  type: objects
  default: []
  schema:
    name: game
    properties:
      title:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 100
      image:
        type: string
      category:
        type: categories
        validations:
          max: 1
      link:
        type: string

footer_enabled:
  type: bool
  default: true

footer_links:
  type: objects
  default:
    - column: "Company"
      text: "EA App"
      url: "https://www.ea.com/ea-app"
    - column: "Company"
      text: "About"
      url: "https://www.ea.com/about"
    - column: "Company"
      text: "Accessibility"
      url: "https://www.ea.com/accessibility"
    - column: "Company"
      text: "Jobs"
      url: "https://www.ea.com/careers"
    - column: "Company"
      text: "Security"
      url: "https://www.ea.com/security"
    - column: "Community & Support"
      text: "Answers HQ"
      url: "https://answers.ea.com"
    - column: "Community & Support"
      text: "How to Contact EA Help"
      url: "https://help.ea.com"
    - column: "Community & Support"
      text: "Online Services Updates"
      url: "https://www.ea.com/service-updates"
    - column: "Community & Support"
      text: "EA Forums"
      url: "/"
    - column: "Legal"
      text: "Legal & Privacy"
      url: "https://www.ea.com/legal"
    - column: "Legal"
      text: "User Agreement"
      url: "https://www.ea.com/terms-of-service"
    - column: "Legal"
      text: "Privacy & Cookie Policy"
      url: "https://www.ea.com/legal/privacy-and-cookie-policy"
    - column: "Legal"
      text: "Cookie Preferences"
      url: "#"
  schema:
    name: link
    properties:
      column:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 60
      text:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 80
      url:
        type: string

footer_social:
  type: objects
  default:
    - icon: "fab-youtube"
      label: "YouTube"
      url: "https://www.youtube.com/ea"
    - icon: "fab-x-twitter"
      label: "X"
      url: "https://x.com/ea"
    - icon: "fab-facebook"
      label: "Facebook"
      url: "https://www.facebook.com/EA"
    - icon: "fab-instagram"
      label: "Instagram"
      url: "https://www.instagram.com/ea"
    - icon: "fab-twitch"
      label: "Twitch"
      url: "https://www.twitch.tv/ea"
  schema:
    name: social
    properties:
      icon:
        type: string
        required: true
      label:
        type: string
        required: true
      url:
        type: string

footer_locale_label:
  default: "English (US)"

footer_copyright:
  default: "© 2026 Electronic Arts Inc."

apex_category_slug:
  default: "apex-legends"
  description: "Slug of the Discourse category that receives the Apex Legends game-hub layout."

apex_hero_eyebrow:
  default: "Apex Legends Community"

apex_hero_image:
  type: upload
  default: ""

apex_description:
  default: "Join the Apex Legends community to discuss the game, share feedback, get help, and report issues."
  textarea: true

apex_featured_tag:
  default: "featured"

apex_featured_max:
  type: integer
  default: 4
  min: 1
  max: 8

apex_important_links:
  type: objects
  default:
    - text: "Apex Legends official site"
      url: "https://www.ea.com/games/apex-legends"
    - text: "EA Help for Apex Legends"
      url: "https://help.ea.com/help-top-issues/?product=apex-legends"
    - text: "Apex Legends status"
      url: "https://help.ea.com/help/faq/are-ea-servers-down/"
  schema:
    name: link
    properties:
      text:
        type: string
        required: true
      url:
        type: string
        required: true

ea_help_data_endpoint:
  default: ""
  description: "HTTPS endpoint returning the EA Help section payload. Leave empty to use settings-authored content only."

category_sections:
  type: objects
  default:
    - title: "Trending Games"
      initial_count: 6
  schema:
    name: section
    properties:
      title:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 100
      categories:
        type: categories
      initial_count:
        type: integer
        validations:
          min: 0
          max: 50
      compact:
        type: boolean
        default: false

featured_tag:
  default: "featured"

featured_content_max:
  type: integer
  default: 6
  min: 1
  max: 20

about_title:
  default: "About EA Forums English"

about_text:
  default: "Welcome to EA Forums, where you can chat about games with other players, help each other out, share feedback, and report issues you're having with EA games."
  textarea: true

stat_slider_display_stats:
  type: objects
  default: []
  schema:
    name: stat
    properties:
      title:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 100
      category:
        type: categories
        validations:
          max: 1
      image:
        type: string
      owned:
        type: boolean
        default: false

stat_slider_title:
  default: "Based on your Profile"

stat_slider_background_color:
  default: "var(--primary-very-low)"

stat_slider_text_color:
  default: "var(--primary)"

stat_slider_accent_color:
  default: "var(--tertiary)"

stat_slider_card_width:
  default: "12em"

announcements:
  type: objects
  default:
    - title: "Apex Legends: Marked Patch Notes"
      subtitle: "Apex Legends"
      size: "big"
    - title: "Friday Highlights"
      subtitle: "The Sims 4"
      size: "small"
    - title: "Battlefield 6 Update Notes"
      subtitle: "Battlefield"
      size: "small"
    - title: "Full FC 27 Player Database"
      subtitle: "EA Sports FC 27"
      size: "small"
  schema:
    name: announcement
    properties:
      title:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 150
      subtitle:
        type: string
      meta:
        type: string
      icon:
        type: string
      size:
        type: enum
        default: small
        choices:
          - big
          - small
      image:
        type: string
      link:
        type: string

announcements_heading:
  default: "Announcements"

announcements_shuffle:
  type: bool
  default: false

recommended_max:
  type: integer
  default: 5
  min: 1
  max: 12

recommended_tag:
  default: ""

recommended_see_all_url:
  default: "/latest"

trending_max:
  type: integer
  default: 10
  min: 1
  max: 30

community_heroes_max:
  type: integer
  default: 5
  min: 1
  max: 20

community_heroes_period:
  type: enum
  default: monthly
  choices:
    - daily
    - weekly
    - monthly
    - quarterly
    - yearly
    - all

quests:
  type: objects
  default: []
  schema:
    name: quest
    properties:
      title:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 150
      reward:
        type: string
      image:
        type: string
      icon:
        type: string
      link:
        type: string
