show_breadcrumbs:
  type: bool
  default: true
  refresh: true

category_sections:
  type: objects
  default:
    - title: "Trending Games"
      initial_count: 6
  schema:
    name: section
    properties:
      title:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 100
      categories:
        type: categories
      initial_count:
        type: integer
        validations:
          min: 0
          max: 50
      compact:
        type: boolean
        default: false

featured_tag:
  default: "featured"

featured_content_max:
  type: integer
  default: 6
  min: 1
  max: 20

about_title:
  default: "About EA Forums English"

about_text:
  default: "Welcome to EA Forums, where you can chat about games with other players, help each other out, share feedback, and report issues you're having with EA games."
  textarea: true

stat_slider_display_stats:
  type: objects
  default: []
  schema:
    name: stat
    properties:
      title:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 100
      category:
        type: categories
        validations:
          max: 1
      image:
        type: string

stat_slider_title:
  default: "Community pulse"

stat_slider_background_color:
  default: "var(--primary-very-low)"

stat_slider_text_color:
  default: "var(--primary)"

stat_slider_accent_color:
  default: "var(--tertiary)"

stat_slider_card_width:
  default: "12em"

announcements:
  type: objects
  default:
    - title: "Apex Legends: Marked Patch Notes"
      subtitle: "Apex Legends"
      size: "big"
    - title: "Friday Highlights"
      subtitle: "The Sims 4"
      size: "small"
    - title: "Battlefield 6 Update Notes"
      subtitle: "Battlefield"
      size: "small"
    - title: "Full FC 27 Player Database"
      subtitle: "EA Sports FC 27"
      size: "small"
  schema:
    name: announcement
    properties:
      title:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 150
      subtitle:
        type: string
      size:
        type: enum
        default: small
        choices:
          - big
          - small
      image:
        type: string
      link:
        type: string

announcements_heading:
  default: "Announcements"

announcements_shuffle:
  type: bool
  default: false
