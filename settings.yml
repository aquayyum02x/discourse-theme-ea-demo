show_breadcrumbs:
  type: bool
  default: true
  refresh: true

category_sections:
  type: objects
  default:
    - title: "Trending Games"
      initial_count: 6
  schema:
    name: section
    properties:
      title:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 100
      categories:
        type: categories
      initial_count:
        type: integer
        validations:
          min: 0
          max: 50
      compact:
        type: boolean
        default: false

featured_tag:
  default: "featured"

featured_content_max:
  type: integer
  default: 6
  min: 1
  max: 20

about_title:
  default: "About EA Forums English"

about_text:
  default: "Welcome to EA Forums, where you can chat about games with other players, help each other out, share feedback, and report issues you're having with EA games."
  textarea: true

stat_slider_display_stats:
  type: objects
  default: []
  schema:
    name: stat
    properties:
      title:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 100
      category:
        type: categories
        validations:
          max: 1
      image:
        type: string

stat_slider_title:
  default: "Community pulse"

stat_slider_background_color:
  default: "var(--primary-very-low)"

stat_slider_text_color:
  default: "var(--primary)"

stat_slider_accent_color:
  default: "var(--tertiary)"

stat_slider_card_width:
  default: "12em"

announcements:
  type: objects
  default:
    - title: "Apex Legends: Marked Patch Notes"
      subtitle: "Apex Legends"
      size: "big"
    - title: "Friday Highlights"
      subtitle: "The Sims 4"
      size: "small"
    - title: "Battlefield 6 Update Notes"
      subtitle: "Battlefield"
      size: "small"
    - title: "Full FC 27 Player Database"
      subtitle: "EA Sports FC 27"
      size: "small"
  schema:
    name: announcement
    properties:
      title:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 150
      subtitle:
        type: string
      size:
        type: enum
        default: small
        choices:
          - big
          - small
      image:
        type: string
      link:
        type: string

announcements_heading:
  default: "Announcements"

announcements_shuffle:
  type: bool
  default: false

side_nav_enabled:
  type: bool
  default: true
  refresh: true

side_nav_top_links:
  type: objects
  default:
    - label: "Home"
      icon: "house"
      url: "/"
    - label: "Recent"
      icon: "clock-rotate-left"
      url: "/latest"
    - label: "Trending"
      icon: "fire"
      url: "/top"
    - label: "Badges"
      icon: "award"
      url: "/badges"
  schema:
    name: link
    properties:
      label:
        type: string
        required: true
      icon:
        type: string
        required: true
      url:
        type: string
        required: true

side_nav_games:
  type: objects
  default:
    - title: "EA SPORTS FC 26"
      image: "https://help.ea.com/_images/seegk6e7ypwi/6gpdzMe7UOYdpLqPRkqZpp/0a543b117f22f4b0abf5c61570db3912/fc-26-box-art-image.webp"
      url: "/games/ea-sports-fc/fc-26"
    - title: "Apex Legends"
      image: "https://help.ea.com/_images/seegk6e7ypwi/7jN3C28fdJbwCiVBApxgDe/cadaf9fe8310b4fcc71fae54edd40810/apex-legends-box-art-image.webp"
      url: "/games/apex-legends/apex-legends"
    - title: "Battlefield 6"
      image: "https://help.ea.com/_images/seegk6e7ypwi/1Kj4nr2Of9rFOk0AjOtchf/69d5e5605fff932c2db821c332d2fedd/battlefield-6-box-art-image.webp"
      url: "/games/battlefield/battlefield-6"
  schema:
    name: game
    properties:
      title:
        type: string
        required: true
      image:
        type: string
        required: true
      category:
        type: categories
        validations:
          max: 1
      url:
        type: string
