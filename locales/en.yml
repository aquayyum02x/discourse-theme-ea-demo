en:
  theme_metadata:
    description: "EA Forums demo theme"
    settings:
      show_breadcrumbs: "Show a breadcrumb bar below the header on category, topic, and other inner pages."
      category_sections: "Titled sections of categories (e.g. \"Trending Games\"). Each section has a heading, the categories to feature, an optional initial count before \"Show all\", and a \"compact\" toggle (large cards vs. a compact horizontal stack of boxes)."
      featured_tag: "Topics with this tag are listed in the Featured Content sidebar box."
      featured_content_max: "Maximum number of topics to show in the Featured Content box."
      about_title: "Heading for the About sidebar box."
      about_text: "Body text for the About sidebar box."
      stat_slider_display_stats: "Cards to display in the slider. Each card has a title, an optional category (linking the card to that category's page), and an optional image."
      stat_slider_title: "Heading shown above the stat cards."
      stat_slider_background_color: "Background color for the slider (Discourse color variable or hex value)."
      stat_slider_text_color: "Text color for the slider (Discourse color variable or hex value)."
      stat_slider_accent_color: "Accent color used on the stat cards and controls."
      stat_slider_card_width: "Width of each stat card, such as 12em or 180px."
      announcements: "Announcement cards. Each card has a title, an optional subtitle, an optional image, an optional link, and a size (\"big\" or \"small\") controlling how it's rendered in the grid."
      announcements_heading: "Heading shown above the announcement cards."
      announcements_shuffle: "Shuffle the display order of the announcement cards on every page load instead of using the authored order."
